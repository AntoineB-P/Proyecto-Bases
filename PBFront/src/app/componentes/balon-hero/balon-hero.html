<div class="capa" #capa>
  <div class="entra animate__animated animate__zoomIn" style="animation-delay: 600ms">
    <div class="flota">
      <model-viewer
        #balon
        class="balon"
        src="models/balon.glb"
        alt="Balón de fútbol 3D"
        environment-image="neutral"
        exposure="1.3"
        shadow-intensity="0"
        interaction-prompt="none"
        disable-zoom
        disable-pan
        camera-orbit="0deg 75deg auto">
      </model-viewer>
    </div>
  </div>
</div>
