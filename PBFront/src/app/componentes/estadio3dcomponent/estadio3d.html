<section class="estadio" #contenedor>
  <canvas class="lienzo" #lienzo></canvas>
  <div class="velo"></div>
  <app-balonhero></app-balonhero>

  <div class="capa" #capaTitulo>
    <div class="textos">
      <p class="etiqueta animate__animated animate__fadeInDown">
        <span class="punto animate__animated animate__heartBeat animate__infinite animate__slow"></span>
        Panel de la liga
      </p>

      <h2 class="titulo">
        <span class="linea animate__animated animate__fadeInLeft" style="animation-delay: 200ms">La liga,</span>
        <span class="linea oro animate__animated animate__fadeInLeft" style="animation-delay: 400ms">desde la tribuna</span>
      </h2>

      <p class="bajada animate__animated animate__fadeInUp" style="animation-delay: 700ms">
        Tabla, goleadores, partidos y disciplina en un solo lugar. Gira el estadio para mirarlo desde donde quieras.
      </p>

      <button type="button" class="boton animate__animated animate__fadeInUp" style="animation-delay: 900ms" (click)="bajar()">
        Ver estadísticas
        <i class="bi bi-arrow-down animate__animated animate__bounce animate__infinite"></i>
      </button>
    </div>
  </div>

  <div class="capa" #capaPista>
    <p class="pista animate__animated animate__fadeIn" style="animation-delay: 1400ms">
      <i class="bi bi-arrow-left-right"></i>
      Arrastra para girar
    </p>
  </div>
</section>
