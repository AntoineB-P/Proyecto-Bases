<div class="intro" *ngIf="!terminado" [class.corre]="listo">
  <div class="intro-balon">
    <model-viewer
      src="models/balon.glb"
      alt="Balón de fútbol"
      environment-image="neutral"
      exposure="1.3"
      shadow-intensity="0"
      interaction-prompt="none"
      disable-zoom
      disable-pan
      auto-rotate
      auto-rotate-delay="0"
      rotation-per-second="220deg"
      camera-orbit="0deg 75deg auto"
      (load)="alCargar()"
      (error)="saltar()">
    </model-viewer>
  </div>
</div>
