<aside class="lateral">
  <div class="logo">
    <span class="logo-nombre">Liga<br>BetPlay</span>
    <span class="logo-sub">Panel de gestión</span>
  </div>

  <nav class="menu">
    <ng-container *ngFor="let op of opciones">

      <a class="opcion" *ngIf="op.listo" [routerLink]="op.ruta" routerLinkActive="activa">
        <i class="bi {{ op.icono }}"></i>
        <span>{{ op.nombre }}</span>
      </a>

      <span class="opcion deshabilitada" *ngIf="!op.listo">
        <i class="bi {{ op.icono }}"></i>
        <span>{{ op.nombre }}</span>
        <em>pronto</em>
      </span>

    </ng-container>
  </nav>
</aside>
