<aside class="lateral">
  <div class="logo">
    <span class="logo-icono">PB</span>
    <div class="logo-texto">
      <strong>Liga BetPlay</strong>
      <small>Panel de gestión</small>
    </div>
  </div>

  <nav class="menu">
    <ng-container *ngFor="let op of opciones">

      <a class="opcion" *ngIf="op.listo" [routerLink]="op.ruta" routerLinkActive="activa">
        <i class="bi {{ op.icono }}"></i>
        <span>{{ op.nombre }}</span>
      </a>

      <span class="opcion deshabilitada" *ngIf="!op.listo">
        <i class="bi {{ op.icono }}"></i>
        <span>{{ op.nombre }}</span>
        <em>pronto</em>
      </span>

    </ng-container>
  </nav>
</aside>
